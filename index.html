<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="赛证通 · 大学生竞赛与证书考试查询助手">
<title>赛证通 · 大学生竞赛与考证助手</title>
<link rel="stylesheet" href="css/style.css?v=2.9">
</head>
<body>
<div id="stage">
  <div id="app">

    <!-- 顶部导航栏 -->
    <header id="topbar">
      <div class="tb-left" id="tb-left"></div>
      <div class="tb-title" id="tb-title">赛证通</div>
      <div class="tb-right" id="tb-right">
        <button class="tb-icon-btn" id="btn-messages" title="消息提醒" aria-label="消息提醒">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7v3.6L3.4 15.2a1 1 0 0 0 .9 1.5h15.4a1 1 0 0 0 .9-1.5L19 12.6V9a7 7 0 0 0-7-7zm0 20a3 3 0 0 0 3-3H9a3 3 0 0 0 3 3z"/></svg>
          <span class="dot" id="msg-dot" hidden></span>
        </button>
      </div>
    </header>

    <!-- 主内容区：五个Tab页 -->
    <main id="main">
      <section class="page" id="page-home" aria-label="首页"></section>
      <section class="page" id="page-category" aria-label="分类查询"></section>
      <section class="page" id="page-school" aria-label="校内"></section>
      <section class="page" id="page-community" aria-label="社区"></section>
      <section class="page" id="page-me" aria-label="我的"></section>
    </main>

    <!-- 底部标签导航 -->
    <nav id="tabbar" aria-label="主导航"></nav>

    <!-- 二级页面容器（详情、搜索、预赛、消息等，JS动态渲染） -->
    <div id="overlay-root"></div>

    <!-- 悬浮 AI 助手「小赛」 -->
    <div id="ai-fab" title="小赛 · AI助手" role="button" aria-label="AI助手，可拖动">
      <svg viewBox="0 0 64 64" width="40" height="40">
        <path fill="#fff" d="M32 8a3 3 0 0 1 3 3v2.2c8.6 1.6 15 8.9 15 17.8v9a4 4 0 0 0 4 4 2 2 0 0 1 0 4H10a2 2 0 0 1 0-4 4 4 0 0 0 4-4v-9c0-8.9 6.4-16.2 15-17.8V11a3 3 0 0 1 3-3z"/>
        <circle cx="25" cy="31" r="3.4" fill="#2B5CFF"/>
        <circle cx="39" cy="31" r="3.4" fill="#2B5CFF"/>
        <path d="M25 39.5q7 5 14 0" stroke="#2B5CFF" stroke-width="2.6" fill="none" stroke-linecap="round"/>
        <rect x="15" y="14" width="6" height="10" rx="3" fill="#5B8CFF" transform="rotate(-35 15 14)"/>
        <rect x="43" y="14" width="6" height="10" rx="3" fill="#5B8CFF" transform="rotate(35 43 14)"/>
      </svg>
    </div>

    <!-- AI 对话面板 -->
    <div id="ai-panel" aria-label="AI助手对话面板" hidden>
      <div class="ai-sheet">
      <div class="ai-head">
        <div class="ai-head-left">
          <div class="ai-avatar-s">
            <svg viewBox="0 0 64 64" width="26" height="26"><path fill="#fff" d="M32 8a3 3 0 0 1 3 3v2.2c8.6 1.6 15 8.9 15 17.8v9a4 4 0 0 0 4 4 2 2 0 0 1 0 4H10a2 2 0 0 1 0-4 4 4 0 0 0 4-4v-9c0-8.9 6.4-16.2 15-17.8V11a3 3 0 0 1 3-3z"/><circle cx="25" cy="31" r="3.4" fill="#2B5CFF"/><circle cx="39" cy="31" r="3.4" fill="#2B5CFF"/><path d="M25 39.5q7 5 14 0" stroke="#2B5CFF" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg>
          </div>
          <div>
            <div class="ai-name">小赛 <span class="ai-online">在线</span></div>
            <div class="ai-sub">赛事查询 · 智能推荐 · 规则解读</div>
          </div>
        </div>
        <button class="ai-close" id="ai-close" aria-label="关闭">×</button>
      </div>
      <div class="ai-msgs" id="ai-msgs"></div>
      <div class="ai-chips" id="ai-chips"></div>
      <div class="ai-input-row">
        <input id="ai-input" type="text" placeholder="问小赛：查比赛、找证书、要推荐…" autocomplete="off">
        <button id="ai-send" aria-label="发送">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M3.4 20.4 20.9 12 3.4 3.6l.02 6.53L14 12l-10.58 1.87z"/></svg>
        </button>
      </div>
      </div>
    </div>

    <!-- 全局轻提示 -->
    <div id="toast" role="status" aria-live="polite"></div>

  </div>
</div>
<script src="js/data.js?v=2.9"></script>
<script src="js/ai.js?v=2.9"></script>
<script src="js/app.js?v=2.9"></script>
</body>
</html>
